name: Syntax check
on:
  push:
    branches:
      - feature-case-management-approval-workflows
  workflow_dispatch:
jobs:
  node-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check index.js
